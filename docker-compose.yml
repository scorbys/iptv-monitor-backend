name: iptv-app

services:
  backend-v1:
    container_name: iptv-backend-v1
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3001"
    env_file:
      - .env

  backend-v2:
    container_name: iptv-backend-v2
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3001"
    env_file:
      - .env

  ml-service:
    container_name: iptv-ml-service
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - ./ml-service/.env

  nginx:
    container_name: iptv-nginx
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend-v1
      - backend-v2
      - ml-service
      - prometheus
      - grafana
      - jenkins
  
  prometheus:
    container_name: iptv-prometheus
    build:
      context: .
      dockerfile: Dockerfile.prometheus
    expose:
      - "9090"
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    container_name: iptv-grafana
    image: grafana/grafana
    expose: ["3000"]
    environment:
      - GF_SERVER_ROOT_URL=https://sufficient-probably-entirely-rotation.trycloudflare.com/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_DOMAIN=https://sufficient-probably-entirely-rotation.trycloudflare.com
    deploy:
      resources:
        limits:
          memory: 256M

  cadvisor:
    container_name: iptv-cadvisor
    image: gcr.io/cadvisor/cadvisor:latest
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose: ["8080"]

  node-exporter:
    image: prom/node-exporter:latest
    container_name: iptv-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    expose: ["9100"]

  jenkins:
    container_name: iptv-jenkins
    image: jenkins/jenkins:lts
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      - JENKINS_OPTS=--prefix=/jenkins
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default

networks:
  default:
    name: iptv-network
    external: true

volumes:
  jenkins_data:
