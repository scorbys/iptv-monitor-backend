name: iptv-app

services:
  backend-v1:
    container_name: iptv-backend-v1
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3001"
    env_file:
      - .env
    networks:
      - iptv-network

  backend-v2:
    container_name: iptv-backend-v2
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3001"
    env_file:
      - .env
    networks:
      - iptv-network

  ml-service:
    container_name: iptv-ml-service
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - ./ml-service/.env
    networks:
      - iptv-network

  nginx:
    container_name: iptv-nginx
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend-v1
      - backend-v2
      - ml-service
      - prometheus
      - grafana
      - jenkins
    networks:
      - iptv-network
  
  prometheus:
    container_name: iptv-prometheus
    build:
      context: .
      dockerfile: Dockerfile.prometheus
    expose:
      - "9090"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - iptv-network

  grafana:
    container_name: iptv-grafana
    image: grafana/grafana
    expose: ["3000"]
    environment:
      - GF_SERVER_ROOT_URL=https://be.radissonuluwatu.my.id/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_DOMAIN=be.radissonuluwatu.my.id
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - iptv-network

  cadvisor:
    container_name: iptv-cadvisor
    image: gcr.io/cadvisor/cadvisor:latest
    privileged: true
    command:
      - '--docker_only=true'
      - '--housekeeping_interval=15s'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose: ["8080"]
    networks:
      - iptv-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: iptv-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    expose: ["9100"]
    networks:
      - iptv-network

  jenkins:
    container_name: iptv-jenkins
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    group_add:
      - "${DOCKER_GID:-110}"
    restart: unless-stopped
    expose:
      - "8080"
      - "50000"
    environment:
      - JENKINS_OPTS=--prefix=/jenkins
      - JENKINS_URL=https://be.radissonuluwatu.my.id/jenkins/
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Dhudson.security.csrf.GlobalCrumbIssuerConfiguration.DISABLE_CSRF_PROTECTION=true
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - iptv-network

networks:
  iptv-network:
    name: iptv-network
    external: true

volumes:
  jenkins_data:
  grafana_data:
